# Local development services for ЦагАвъя.
# Values come from the `.env` file next to this file (Docker Compose reads it automatically).
#   Start:  npm run db:up     (docker compose up -d --wait)
#   Stop:   npm run db:down   (docker compose down)
#   Logs:   npm run db:logs   (docker compose logs -f db)

name: tsagavya

services:
  db:
    # Pinned version: upgrade deliberately, never silently via `latest`.
    image: postgres:18.6-alpine
    container_name: tsagavya-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing in .env}
      # Store and compare timestamps in UTC; convert to Asia/Ulaanbaatar only for display.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bind to localhost only so the database is not reachable from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
